# 모니터링 ApplicationSet (Grafana + Prometheus)
# - generator: charts/argocd/configurations/prod/monitoring-*-cfg.yaml (앱 1개 = cfg 파일 1개)
# - 차트 기본값: charts/helm/{env}/{chartName}/values.yaml (upstream 원본)
# - prod override: charts/argocd/applicationsets/valuefiles/{env}/{valuesDir}/values.yaml ($values ref)
# - 반영: kubectl apply -f argocd_yaml/prod-applicationsets-prom-grafana.yaml (ApplicationSet은 GitOps 대상 아님)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infra-monitoring-prod
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/ggorockee/infra.git
      revision: main
      files:
      - path: "charts/argocd/configurations/prod/monitoring-*-cfg.yaml"

  template:
    metadata:
      name: '{{ .appName }}'
    spec:
      project: default
      sources:
      - repoURL: '{{ .repoURL }}'
        targetRevision: '{{ .revision }}'
        path: 'charts/helm/{{ .env }}/{{ .chartName }}'
        helm:
          releaseName: '{{ .appName }}'
          valueFiles:
          - values.yaml
          - '$values/charts/argocd/applicationsets/valuefiles/{{ .env }}/{{ .valuesDir }}/values.yaml'
      - repoURL: '{{ .repoURL }}'
        targetRevision: '{{ .revision }}'
        ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        # Prometheus Operator CRD가 커서 client-side apply annotation 한도(256KB) 초과
        - ServerSideApply=true
      # Operator가 갱신하는 status 차이 무시
      ignoreDifferences:
      - group: monitoring.coreos.com
        kind: Alertmanager
        jsonPointers:
        - /status
      - group: monitoring.coreos.com
        kind: Prometheus
        jsonPointers:
        - /status
