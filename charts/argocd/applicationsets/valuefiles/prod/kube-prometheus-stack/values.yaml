# kube-prometheus-stack prod override
# - 차트: charts/helm/prod/kube-prometheus-stack (93.2.2, values.yaml은 upstream 원본 유지)
# - 적용: argocd_yaml/prod-applicationsets-prom-grafana.yaml 의 multi-source ($values)
# - 설계: claudedocs/monitoring-grafana-prometheus-design.md

#########################################################################
# [커스텀] Secret Manager 동기화 (templates/custom-externalsecrets.yaml)
#########################################################################
customExternalSecretStore: gcpsm-secret-store

customExternalSecrets:
  # Grafana Google OAuth + 관리자 계정
  grafana-oauth-secret:
    gcpSecretName: prod-monitoring-smtp-credentials
    data:
      client_id: google.clientId
      client_secret: google.clientSecret
      admin_password: password
    staticData:
      admin_user: woohaen88

  # Grafana → Cloud SQL(리뷰맵) 조회용 접속 정보 (envFromSecrets로 주입)
  grafana-reviewmaps-db:
    gcpSecretName: prod-reviewmaps-db-credentials
    data:
      REVIEWMAPS_DB_HOST: POSTGRES_HOST
      REVIEWMAPS_DB_PORT: POSTGRES_PORT
      REVIEWMAPS_DB_USER: POSTGRES_USER
      REVIEWMAPS_DB_PASSWORD: POSTGRES_PASSWORD
      REVIEWMAPS_DB_NAME: POSTGRES_DB

  # Alertmanager 설정 전체 (SMTP 값이 Alertmanager 설정 파일에 직접 들어가야 하므로 ESO 템플릿으로 생성)
  alertmanager-custom-config:
    gcpSecretName: prod-monitoring-smtp-credentials
    mergePolicy: Replace
    data:
      EMAIL_HOST: EMAIL_HOST
      EMAIL_PORT: EMAIL_PORT
      EMAIL_HOST_USER: EMAIL_HOST_USER
      EMAIL_HOST_PASSWORD: EMAIL_HOST_PASSWORD
    templateFiles:
      alertmanager.yaml: files/alertmanager.yaml.tmpl

#########################################################################
# GKE에서 접근 불가한 컨트롤 플레인 대상 비활성화
#########################################################################
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false

#########################################################################
# Grafana
#########################################################################
grafana:
  enabled: true
  deploymentStrategy:
    type: Recreate  # RWO PVC 사용

  admin:
    existingSecret: grafana-oauth-secret
    userKey: admin_user
    passwordKey: admin_password

  persistence:
    enabled: true
    type: pvc
    storageClassName: gcp-standard-rwo-retain
    accessModes:
      - ReadWriteOnce
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  service:
    type: ClusterIP
    port: 80
    targetPort: 3000

  grafana.ini:
    server:
      domain: monitoring.ggorockee.com
      root_url: "https://monitoring.ggorockee.com"
      serve_from_sub_path: false
    date_formats:
      default_timezone: Asia/Seoul
    dashboards:
      # 로그인 직후 Home 화면에 리뷰맵 CronJob 대시보드 표시 (sidecar가 /tmp/dashboards에 저장)
      default_home_dashboard_path: /tmp/dashboards/reviewmaps-cronjob-dashboard.json
    users:
      default_theme: dark
    auth.generic_oauth:
      enabled: true
      name: Google
      allow_sign_up: true
      client_id: $__file{/etc/secrets/auth/client_id}
      client_secret: $__file{/etc/secrets/auth/client_secret}
      scopes: openid email profile
      auth_url: https://accounts.google.com/o/oauth2/v2/auth
      token_url: https://oauth2.googleapis.com/token
      api_url: https://openidconnect.googleapis.com/v1/userinfo
      allowed_domains: gmail.com
      allow_assign_grafana_admin: true
      role_attribute_path: "(email == 'woohaen88@gmail.com' || email == 'woohalabs@gmail.com' || email == 'ggorockee@gmail.com') && 'Admin' || 'Viewer'"
    auth.anonymous:
      enabled: false

  extraSecretMounts:
    - name: auth-generic-oauth-secret
      secretName: grafana-oauth-secret
      defaultMode: 0440
      mountPath: /etc/secrets/auth
      readOnly: true

  envFromSecrets:
    - name: grafana-reviewmaps-db

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
      defaultDatasourceEnabled: true

  additionalDataSources:
    - name: ReviewMaps-DB
      uid: reviewmaps-db
      type: grafana-postgresql-datasource
      access: proxy
      url: "${REVIEWMAPS_DB_HOST}:${REVIEWMAPS_DB_PORT}"
      user: "${REVIEWMAPS_DB_USER}"
      secureJsonData:
        password: "${REVIEWMAPS_DB_PASSWORD}"
      jsonData:
        database: "${REVIEWMAPS_DB_NAME}"
        sslmode: disable
        postgresVersion: 1500
        timescaledb: false
        maxOpenConns: 2
        maxIdleConns: 1
      editable: false

#########################################################################
# Prometheus (외부 노출 없음, Grafana에서만 조회)
#########################################################################
prometheus:
  enabled: true
  ingress:
    enabled: false
  prometheusSpec:
    retention: 15d
    retentionSize: "18GB"
    scrapeInterval: 30s
    evaluationInterval: 30s
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 3Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gcp-standard-rwo-retain
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
    # 모든 네임스페이스의 ServiceMonitor/PodMonitor/PrometheusRule 수집
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false

#########################################################################
# Alertmanager (이메일 알림, 설정은 alertmanager-custom-config Secret 사용)
#########################################################################
alertmanager:
  enabled: true
  alertmanagerSpec:
    useExistingSecret: true
    configSecret: alertmanager-custom-config
    # 이메일 제목/본문 템플릿 (templates/custom-alertmanager-templates.yaml)
    # → /etc/alertmanager/configmaps/alertmanager-email-templates/ 에 마운트
    configMaps:
      - alertmanager-email-templates
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gcp-standard-rwo-retain
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

#########################################################################
# 리뷰맵 CronJob 알림 규칙
#########################################################################
additionalPrometheusRulesMap:
  reviewmaps-cronjob:
    groups:
      - name: reviewmaps.cronjob
        rules:
          - alert: ReviewmapsCronJobNotSucceeded
            expr: time() - kube_cronjob_status_last_successful_time{namespace="reviewmaps"} > 26 * 3600
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "리뷰맵 CronJob {{ $labels.cronjob }} 26시간 이상 성공 기록 없음"
              description: "마지막 성공 후 {{ $value | humanizeDuration }} 경과. kubectl -n reviewmaps get jobs 로 실패 Job과 로그를 확인하세요."
          # Job 실패 → 이메일 (warning)
          - alert: ReviewmapsJobFailed
            expr: |
              max by (namespace, job_name, owner_name) (
                (kube_job_status_failed{namespace="reviewmaps"} > 0)
                * on (namespace, job_name) group_left (owner_name)
                kube_job_owner{namespace="reviewmaps", owner_kind="CronJob"}
              )
            for: 1m
            labels:
              severity: critical  # 메일 제목 [ERROR]
            annotations:
              summary: "❌ 리뷰맵 CronJob {{ $labels.owner_name }} 실패"
              description: "Job {{ $labels.job_name }} 이 backoffLimit을 초과해 실패했습니다. Job TTL(1시간) 전에 kubectl -n reviewmaps logs job/{{ $labels.job_name }} 으로 로그를 확인하세요. 대시보드: https://monitoring.ggorockee.com/d/reviewmaps-cronjob"
          # Job 성공 → 이메일 (info, Job 1개당 1회, resolved 메일 없음)
          - alert: ReviewmapsJobSucceeded
            expr: |
              max by (namespace, job_name, owner_name) (
                (
                  kube_job_status_completion_time{namespace="reviewmaps"}
                  - kube_job_status_start_time{namespace="reviewmaps"}
                )
                * on (namespace, job_name) group_left (owner_name)
                kube_job_owner{namespace="reviewmaps", owner_kind="CronJob"}
                and on (namespace, job_name) (kube_job_status_succeeded{namespace="reviewmaps"} > 0)
                and on (namespace, job_name) ((time() - kube_job_status_completion_time{namespace="reviewmaps"}) < 3000)
              )
            labels:
              severity: info
            annotations:
              summary: "✅ 리뷰맵 CronJob {{ $labels.owner_name }} 성공"
              description: "Job {{ $labels.job_name }} 이 정상 완료되었습니다 (실행 시간 {{ $value | humanizeDuration }}). DB 적재 건수는 대시보드에서 확인하세요: https://monitoring.ggorockee.com/d/reviewmaps-cronjob"
          - alert: ReviewmapsJobRunningTooLong
            expr: (time() - kube_job_status_start_time{namespace="reviewmaps"}) > 7200 and on (namespace, job_name) (kube_job_status_active{namespace="reviewmaps"} > 0)
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "리뷰맵 Job {{ $labels.job_name }} 2시간 이상 실행 중"
              description: "스크래핑 대상 사이트 응답 지연 또는 hang 가능성이 있습니다."

  # 리뷰맵 수집 서버(go-scraper) 키워드별 결과 — Pushgateway (job="reviewmaps_scraper")
  # 대시보드 "ReviewMaps 수집 서버"의 색상 기준과 동일한 값 사용
  reviewmaps-scraper:
    groups:
      - name: reviewmaps.scraper
        rules:
          - alert: ReviewmapsScraperKeywordFailed
            expr: reviewmaps_scraper_last_run_success{job="reviewmaps_scraper"} == 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "❌ 수집 실패: {{ $labels.scraper }} / {{ $labels.keyword }}"
              description: "키워드 '{{ $labels.keyword }}' 마지막 실행이 에러로 끝났습니다. CronJob 재시도 후에도 15분간 성공하지 못했습니다. 수집 서버 대시보드: https://monitoring.ggorockee.com/d/reviewmaps-scraper"
          - alert: ReviewmapsScraperKeywordStale
            expr: (time() - reviewmaps_scraper_last_success_timestamp_seconds{job="reviewmaps_scraper"}) > 26 * 3600
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "❌ 26시간 넘게 수집 안 됨: {{ $labels.scraper }} / {{ $labels.keyword }}"
              description: "마지막 성공 후 {{ $value | humanizeDuration }} 경과. 키워드를 설정에서 뺀 경우라면 Pushgateway에서 해당 그룹을 삭제하세요."
          - alert: ReviewmapsScraperZeroItems
            expr: |
              reviewmaps_scraper_last_run_items{job="reviewmaps_scraper", scraper!="cleanup", stage="scraped"} == 0
              and on (scraper, keyword) reviewmaps_scraper_last_run_success{job="reviewmaps_scraper"} == 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "⚠️ 0건 수집: {{ $labels.scraper }} / {{ $labels.keyword }}"
              description: "실행은 성공했지만 캠페인을 1건도 받지 못했습니다. 사이트 구조 변경, 차단, API 장애를 확인하세요."
          - alert: ReviewmapsScraperItemsDropped
            expr: |
              reviewmaps_scraper_last_run_items{job="reviewmaps_scraper", scraper!="cleanup", stage="scraped"}
                < 0.5 * (reviewmaps_scraper_last_run_items{job="reviewmaps_scraper", scraper!="cleanup", stage="scraped"} offset 1d)
              and (reviewmaps_scraper_last_run_items{job="reviewmaps_scraper", scraper!="cleanup", stage="scraped"} offset 1d) >= 20
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "⚠️ 수집량 급감: {{ $labels.scraper }} / {{ $labels.keyword }} ({{ $value }}건)"
              description: "전일 같은 시각 대비 50% 미만으로 줄었습니다 (전일 20건 이상인 키워드만 판단)."
          - alert: ReviewmapsScraperEnrichErrorsHigh
            expr: |
              (reviewmaps_scraper_last_run_enrich{job="reviewmaps_scraper", type="error"}
                / on (scraper, keyword) reviewmaps_scraper_last_run_enrich{job="reviewmaps_scraper", type="total"}) > 0.2
              and on (scraper, keyword) reviewmaps_scraper_last_run_enrich{job="reviewmaps_scraper", type="total"} >= 10
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "⚠️ 주소/좌표 보강 에러율 {{ $value | humanizePercentage }}: {{ $labels.scraper }} / {{ $labels.keyword }}"
              description: "네이버 검색/지오코딩 API 에러가 20%를 넘었습니다. API 일일 한도 초과나 키 만료를 확인하세요."
          - alert: ReviewmapsScraperServerAPIError
            expr: reviewmaps_scraper_last_run_server_api_error{job="reviewmaps_scraper"} == 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "⚠️ 키워드 알림 처리 실패: {{ $labels.scraper }} / {{ $labels.keyword }}"
              description: "수집 후 서버 API(/v1/internal/process-campaign-alerts) 호출에 실패해 사용자 키워드 알림이 생성되지 않았을 수 있습니다."

  # 리뷰맵 API 서버(reviewmaps-server) — 대시보드 "ReviewMaps HTTP Metrics"와 동일 기준
  reviewmaps-server:
    groups:
      - name: reviewmaps.server
        rules:
          - alert: ReviewmapsServerHighErrorRate
            expr: |
              sum(rate(reviewmaps_http_requests_total{status=~"5.."}[5m]))
                / sum(rate(reviewmaps_http_requests_total[5m])) > 0.05
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "❌ API 서버 5xx 오류율 {{ $value | humanizePercentage }}"
              description: "최근 5분 요청 중 5% 이상이 서버 오류입니다. HTTP 대시보드: https://monitoring.ggorockee.com/d/reviewmaps-http-metrics"
          - alert: ReviewmapsServerSlow
            expr: |
              histogram_quantile(0.95, sum by (le) (rate(reviewmaps_http_request_duration_seconds_bucket{path!~"/healthz|/v1/readiness|/v1/liveness|/v1/health|/v1/healthz"}[5m]))) > 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "⚠️ API 서버 응답 지연 (P95 {{ $value | humanizeDuration }})"
              description: "상태 확인 요청을 제외한 API의 P95 응답 시간이 15분간 1초를 넘었습니다."
          - alert: ReviewmapsServerDown
            expr: |
              sum(up{namespace="reviewmaps", service="reviewmaps-server"}) == 0
              or absent(up{namespace="reviewmaps", service="reviewmaps-server"})
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "❌ API 서버 메트릭 수집 불가 (서버 다운 가능성)"
              description: "Prometheus가 5분간 reviewmaps-server /metrics를 수집하지 못했습니다. kubectl -n reviewmaps get pods 로 확인하세요."

