# app-metrics-exporter prod override
# - 차트: charts/helm/prod/app-metrics-exporter (수집 코드 files/exporter.py)
# - 용도: 앱 사용자·비정상 종료·광고 수입(AdMob)·광고비(Google Ads)·Remote Config·스토어·app-ads.txt를 Prometheus로 노출
# - 인증: 키 파일 없이 Workload Identity
#         KSA monitoring/app-metrics-exporter → GSA app-metrics-reader-prod (Terraform modules/monitoring)
#         GA4 속성 뷰어, 앱 Firebase 프로젝트 roles/cloudconfig.viewer (모두 읽기 전용)
# - 문서: claudedocs/app-metrics-monitoring.md

serviceAccount:
  gcpServiceAccount: app-metrics-reader-prod@yanggo-514212.iam.gserviceaccount.com

admob:
  publisher: pub-8516861197467665

# 앱을 추가하거나 스토어에 공개되면 이 목록을 고친다
# - released: 스토어에 공개되어 있어야 하는 플랫폼 (빠지면 AppStoreListingMissing 알림)
# - crashlytics: 앱에 Crashlytics가 들어 있으면 true (없으면 비정상 종료 비율을 내보내지 않음)
# - stage: 출시 전 플랫폼의 단계 (testing 테스트 중, review 심사 중). 공개되면 released로 옮김
# - knownIssues: 이미 원인을 아는 알림. 대시보드 알림 목록에 설명이 붙음. 해결되면 지움
# - googleAds: 이 GA4 속성에 Google Ads 계정이 연결되어 있으면 true
apps:
  - name: 리뷰맵
    platforms: [android, ios]
    released: [android, ios]
    ga4Property: "513036605"
    googleAds: true
    crashlytics: true
    knownIssues:
      - alertname: AppOpenAdShowRateLow
        note: 2.2.2에서 수정. Android 11-27 공개, iOS 심사 중. 7일 평균이라 12월 초까지 남음
      - alertname: AppCrashFreeLow
        note: 대부분 종료가 아닌 오류를 종료로 기록한 것. 2.2.2에서 수정(Android 11-27 공개, iOS 심사 중). 7일 평균이라 12월 초까지 남음
      - alertname: AdRevenueDropped
        note: 직전 주 강제 업데이트로 사용자가 일시적으로 늘었던 영향과 신규 유입 부족. Google Ads 증액(11-27) 효과 점검 중
    firebaseProject: reviewmap-c03f1
    admobAppIds:
      android: ca-app-pub-8516861197467665~2285990824
      ios: ca-app-pub-8516861197467665~7038364871
    appStoreId: "6751343880"
    playPackage: com.reviewmaps.mobile
    publisher: pub-8516861197467665
    appAdsTxt:
      - https://review-maps.com/app-ads.txt
  - name: 돌려받엔
    platforms: [android, ios]
    released: [ios]
    stage:
      android: testing
    ga4Property: "565832639"
    googleAds: true
    firebaseProject: yen-back
    admobAppIds:
      android: ca-app-pub-8516861197467665~8757073285
      ios: ca-app-pub-8516861197467665~1203171840
    appStoreId: "6835096650"
    playPackage: com.woohalabs.yenback
    publisher: pub-8516861197467665
    appAdsTxt:
      - https://yen-back.woohalabs.com/app-ads.txt
      - https://woohalabs.com/app-ads.txt
  - name: 라익찍스
    platforms: [android, ios]
    released: []
    stage:
      android: testing
      ios: review
    # GA4는 App Store 심사 통과 뒤에 연결 (claudedocs/app-metrics-monitoring.md)
    firebaseProject: like-zzix
    admobAppIds:
      android: ca-app-pub-8516861197467665~4570324371
      ios: ca-app-pub-8516861197467665~7224407879
    appStoreId: "6836852971"
    playPackage: com.woohalabs.likezzix
    publisher: pub-8516861197467665
    appAdsTxt:
      - https://like-zzix.woohalabs.com/app-ads.txt
