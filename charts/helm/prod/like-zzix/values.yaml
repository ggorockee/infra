#########################################################################
# 라익찍스 (like-zzix) API 서버
# 소스: https://github.com/ggorockee/like-zzix (server/)
# 대시보드: https://monitoring.ggorockee.com/d/like-zzix · 알림 그룹: like-zzix.server / like-zzix.app
#########################################################################

# 프리셋은 Cloud SQL(관리자 콘솔에서 편집)에서 30초마다 다시 읽고, DB 장애 시 마지막 정상본·번들본으로 응답합니다.
# 관리자 세션도 DB에 있으므로 여러 개로 늘려도 됩니다.
replicaCount: 1
revisionHistoryLimit: 2
image:
  repository: ggorockee/like-zzix-server
  pullPolicy: IfNotPresent
  # CI(like-zzix ci-server.yml)가 main 머지 시 날짜-커밋 태그로 갱신합니다.
  tag: "20261118-b15d21b"
nameOverride: ""
fullnameOverride: ""
podLabels:
  app: "like-zzix-server"
  job: "like-zzix-server"
service:
  type: ClusterIP
  port: 8080
  metricsPort: 9090
# 비밀이 아닌 환경 변수
env:
  LOG_LEVEL: "info"
  # 관리자 콘솔 주소 (CORS 허용 출처)
  ADMIN_ORIGIN: "https://like-zzix-admin.woohalabs.com"
# 비밀 환경 변수: GSM prod-like-zzix-credentials (JSON) → ESO → Secret like-zzix-credentials
# ADMIN_EMAILS(관리자 이메일 목록)·GOOGLE_CLIENT_ID도 공개 저장소에 두지 않으려고 같은 Secret에 보관합니다.
externalSecret:
  enabled: true
  remoteKey: prod-like-zzix-credentials
  keys:
    - POSTGRES_HOST
    - POSTGRES_PORT
    - POSTGRES_USER
    - POSTGRES_PASSWORD
    - POSTGRES_DB
    - ADMIN_EMAILS
    - GOOGLE_CLIENT_ID
metrics:
  serviceMonitor:
    enabled: true # kube-prometheus-stack이 모든 네임스페이스 ServiceMonitor 수집
    interval: 30s
    scrapeTimeout: 10s
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10
nodeSelector: {}
tolerations: []
affinity: {}

#########################################################################
# 관리자 콘솔 (Nuxt 정적 SPA + nginx) — https://like-zzix-admin.woohalabs.com
# 소스: like-zzix admin/ · API는 같은 서버의 /admin/v1 (Google 로그인 + ADMIN_EMAILS)
#########################################################################
admin:
  enabled: true
  replicaCount: 1
  image:
    repository: ggorockee/like-zzix-admin
    pullPolicy: IfNotPresent
    # CI(like-zzix ci-admin.yml)가 main 머지 시 갱신합니다.
    tag: "latest"
  port: 8080
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
