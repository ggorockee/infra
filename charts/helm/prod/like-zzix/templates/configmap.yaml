apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "like-zzix.fullname" . }}
  labels:
    {{- include "like-zzix.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.service.port | quote }}
  METRICS_PORT: {{ .Values.service.metricsPort | quote }}
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
