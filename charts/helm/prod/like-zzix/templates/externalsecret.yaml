{{- if .Values.externalSecret.enabled }}
# GSM의 DB 접속 정보·관리자 설정을 Secret으로 주입 (값은 저장소에 두지 않음)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "like-zzix.fullname" . }}-credentials
  labels:
    {{- include "like-zzix.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcpsm-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ include "like-zzix.fullname" . }}-credentials
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecret.keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.externalSecret.remoteKey }}
        property: {{ . }}
    {{- end }}
{{- end }}
