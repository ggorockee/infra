{{- if index .Values "go-scraper" "enabled" }}
# 리뷰노트 상세(로그인 필요) 수집용 세션 쿠키. go-scraper reviewnote-detail 이 사용.
# 약 15일마다 수집 전용 계정으로 다시 로그인해 GSM 새 버전으로 갱신 (절차: reviewmaps 레포 claudedocs/reviewnote-travel-selenium.md)
# 만료 3일 전 [WARN] 메일: 알림 ReviewnoteSessionExpiringSoon
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "reviewmaps.fullname" . }}-reviewnote-session
  labels:
    {{- include "reviewmaps.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcpsm-secret-store
    kind: ClusterSecretStore
  target:
    name: reviewnote-session
    creationPolicy: Owner
  data:
    - secretKey: REVIEWNOTE_SESSION
      remoteRef:
        key: prod-reviewmaps-reviewnote-session
        property: REVIEWNOTE_SESSION
    - secretKey: REVIEWNOTE_SESSION_EXPIRES_AT
      remoteRef:
        key: prod-reviewmaps-reviewnote-session
        property: REVIEWNOTE_SESSION_EXPIRES_AT
{{- end }}
