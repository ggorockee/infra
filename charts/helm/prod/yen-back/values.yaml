#########################################################################
# 돌려받엔 (yen-back) API 서버
# 소스: https://github.com/ggorockee/yen-back (server/)
#########################################################################

# 메모리 저장소 + 앱 내 수집 스케줄러(COLLECT_INTERVAL) 구성이므로 1개로 운영합니다.
# 재시작 시 첫 요청/첫 수집에서 환율을 다시 받아옵니다 (최대 수 초).
replicaCount: 1
revisionHistoryLimit: 2
image:
  repository: ggorockee/yen-back-server
  pullPolicy: IfNotPresent
  # CI(yen-back ci-server.yml)가 main 머지 시 날짜-커밋 태그로 갱신합니다.
  tag: "20261115-4c2fd14"
nameOverride: ""
fullnameOverride: ""
podLabels:
  app: "yen-back-server"
  job: "yen-back-server"
service:
  type: ClusterIP
  port: 8080
  metricsPort: 9090
# 비밀이 아닌 환경 변수
env:
  COLLECT_INTERVAL: "30m"
  LOG_LEVEL: "info"
  # Google Places 일일 과금 호출 상한 (KST 자정 초기화). 넘으면 근처 지점 검색만 잠시 꺼짐
  # 160 x 31일 = 4,960회 < 월 무료 5,000회 (Text Search Pro). GCP 쿼터도 160/일로 이중 제한
  PLACES_DAILY_LIMIT: "160"
  # 비워두면 메모리 저장소. Postgres를 쓰려면 secret에 DATABASE_URL을 추가하세요.
# GCP Secret Manager → ExternalSecret → Secret (envFrom)
# 시크릿 이름: prod-yen-back-credentials (JSON: KOREAEXIM_API_KEY, INTERNAL_TOKEN, GOOGLE_PLACES_API_KEY)
externalSecret:
  enabled: true
  remoteKey: prod-yen-back-credentials
  keys:
    - KOREAEXIM_API_KEY
    - INTERNAL_TOKEN
    - GOOGLE_PLACES_API_KEY
metrics:
  serviceMonitor:
    enabled: true # kube-prometheus-stack이 모든 네임스페이스 ServiceMonitor 수집
    interval: 30s
    scrapeTimeout: 10s
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10
nodeSelector: {}
tolerations: []
affinity: {}
