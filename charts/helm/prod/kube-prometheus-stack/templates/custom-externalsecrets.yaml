{{- /*
  [커스텀] GCP Secret Manager → Kubernetes Secret 동기화 (External Secrets Operator)
  upstream 차트에는 없는 파일. 차트 업그레이드 시 함께 보존할 것.

  values 예시 (customExternalSecrets.<secret 이름>):
    gcpSecretName: Secret Manager 시크릿 이름 (JSON)
    data:          { <k8s secret key>: <JSON property 경로> }
    staticData:    { <k8s secret key>: <고정 문자열> }        # 선택
    templateFiles: { <k8s secret key>: <차트 내 파일 경로> }  # 선택, ESO 템플릿(v2)으로 렌더링
    mergePolicy:   Merge | Replace                             # 선택, 기본 Merge
*/ -}}
{{- $store := .Values.customExternalSecretStore | default "gcpsm-secret-store" }}
{{- range $name, $es := .Values.customExternalSecrets }}
{{- if ne (toString $es.enabled) "false" }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ include "kube-prometheus-stack.namespace" $ }}
  labels:
    {{- include "kube-prometheus-stack.labels" $ | nindent 4 }}
  annotations:
    # Secret을 사용하는 Grafana/Alertmanager보다 먼저 생성
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $es.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $store }}
    kind: ClusterSecretStore
  target:
    name: {{ $name }}
    creationPolicy: Owner
    # ESO가 채우는 기본값을 명시 (ServerSideApply diff로 인한 OutOfSync 방지)
    deletionPolicy: Retain
    {{- if or $es.staticData $es.templateFiles }}
    template:
      engineVersion: v2
      mergePolicy: {{ $es.mergePolicy | default "Merge" }}
      data:
        {{- range $key, $value := $es.staticData }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- range $key, $path := $es.templateFiles }}
        {{ $key }}: |
          {{- $.Files.Get $path | nindent 10 }}
        {{- end }}
    {{- end }}
  data:
    {{- range $key, $property := $es.data }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $es.gcpSecretName }}
        property: {{ $property }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
{{- end }}
{{- end }}
